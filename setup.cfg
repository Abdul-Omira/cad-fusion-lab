[metadata]
name = cad-fusion-lab
version = attr: src.__version__.__version__

[options]
packages = find:
python_requires = >=3.9

[options.packages.find]
where = .
include = src*, scripts*
exclude = tests*, docs*, outputs*, data*

[flake8]
max-line-length = 100
extend-ignore = E203, E266, E501, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    .venv,
    venv,
    data,
    outputs,
    .ipynb_checkpoints
max-complexity = 10
per-file-ignores =
    __init__.py:F401
    tests/*:E501,F401,F811

[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
